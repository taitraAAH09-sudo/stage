<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名單比對・重複標灰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#1f2a33;--mute:#7a7f84;--line:#d9d3c7;--accent:#b5462f;--keep:#1f6f5c;--grey:#d9d9d9;--warn:#b7791f;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d20;--paper:#23272b;--ink:#ece8df;--mute:#9aa0a6;--line:#3a3f44;--grey:#44494e}}
:root[data-theme="dark"]{--bg:#1a1d20;--paper:#23272b;--ink:#ece8df;--mute:#9aa0a6;--line:#3a3f44;--grey:#44494e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:.04em}
h1 .g{background:var(--grey);padding:0 8px;border-radius:4px}
.sub{color:var(--mute);margin:0 0 22px;font-size:.95rem}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.drops,.cfg{grid-template-columns:1fr!important}}
.drop{background:var(--paper);border:2px dashed var(--line);border-radius:10px;padding:18px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop b{display:block;font-size:1.05rem}.drop small{color:var(--mute)}
.drop .fn{margin-top:8px;font-size:.88rem;color:var(--keep);word-break:break-all}
.drop input{display:none}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;color:#fff;margin-right:6px}
.tA{background:var(--mute)}.tB{background:var(--accent)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.panel h2{font-size:1rem;margin:0 0 10px}
.cfg{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.pair{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pair span{color:var(--mute)}
select,input[type=range]{font:inherit}
select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:220px}
.mode label{display:block;margin-bottom:6px;cursor:pointer}
.thr{display:flex;align-items:center;gap:10px;margin-top:6px}
.thr b{min-width:3em}
.hint{color:var(--mute);font-size:.82rem}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--ink);color:var(--paper)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:transparent;color:var(--mute);padding:4px 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:.9rem}
.stat strong{font-size:1.25rem;margin-left:6px}
.stat.k strong{color:var(--keep)}.stat.f strong{color:var(--warn)}
.spacer{flex:1}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--paper);z-index:1}
tbody tr{cursor:pointer}
tr.dup td{background:var(--grey)}
td.m{color:var(--mute);font-size:.82rem}
.fz{color:var(--warn);font-weight:700}
.man{font-size:.72rem;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>名單比對・<span class="g">重複標灰</span></h1>
  <p class="sub">A 是已經有的總表，B 是要拉出來寄的名單。B 裡面在 A 已經有的人，整列標灰；白底就是要寄的。</p>

  <div class="drops">
    <label class="drop" id="dA"><span class="tag tA">A</span><b>總表（已涵蓋的名單）</b><small>例：總表03 開幕典禮</small><div class="fn" id="fA"></div><input type="file" accept=".xlsx" id="iA"></label>
    <label class="drop" id="dB"><span class="tag tB">B</span><b>要拉出來的名單</b><small>例：總表02 VIP 邀請函</small><div class="fn" id="fB"></div><input type="file" accept=".xlsx" id="iB"></label>
  </div>

  <div class="panel" id="cfg" hidden>
    <div class="cfg" style="display:grid">
      <div>
        <h2>以哪些欄位為基準</h2>
        <div class="pair" style="margin-bottom:12px">
          <span>A 工作表</span><select id="shA"></select><span>B 工作表</span><select id="shB"></select>
        </div>
        <div id="pairs"></div>
        <button class="alt" id="addPair">＋ 加一組欄位</button>
        <div class="hint" style="margin-top:6px">多組欄位時，要每一組都對得上才算重複（例如「人名」＋「單位」）。</div>
      </div>
      <div class="mode">
        <h2>比對方式</h2>
        <label><input type="radio" name="mode" value="exact"> 完全相同（忽略空白、標點、臺／台）</label>
        <label><input type="radio" name="mode" value="fuzzy" checked> 模糊比對</label>
        <div class="thr"><span>相似度</span><input type="range" id="thr" min="50" max="100" step="5" value="85"><b id="thrV">85%</b></div>
        <div class="hint">模糊比對也會把「包含」算進去（例：「高雄辦事處」對到「經濟部國際貿易署高雄辦事處」，至少 3 個字才算）。三個字的人名差一個字只有 67%，門檻別拉太低，不然不同人也會被標灰。</div>
      </div>
    </div>
  </div>

  <div class="bar" id="bar" hidden>
    <div class="stat k">要寄（白底）<strong id="nK">0</strong></div>
    <div class="stat">已重複（灰底）<strong id="nD">0</strong></div>
    <div class="stat f">其中模糊對到<strong id="nF">0</strong></div>
    <div class="spacer"></div>
    <label style="font-size:.9rem"><input type="checkbox" id="onlyKeep"> 只看要寄的</label>
    <button id="dl">下載標好的 B（xlsx）</button>
  </div>
  <div class="hint" id="clickHint" hidden>點任一列可以手動切換灰／白（標「手動」）；<span class="fz">≈</span> 表示是模糊對到的，建議看一眼右邊「A 裡對到的」。</div>
  <div class="tbl" id="out"></div>
</div>

<script>
const S={A:null,B:null,res:null,manual:{}};
const norm=s=>String(s??'').normalize('NFKC').replace(/[\s\u3000·．.、,，()（）\-—_/]/g,'').replace(/臺/g,'台').toLowerCase();
function cellText(v){if(v==null)return'';if(v instanceof Date)return v.toLocaleDateString();if(typeof v==='object'){if(v.richText)return v.richText.map(t=>t.text).join('');if('result'in v)return String(v.result??'');if(v.text)return String(v.text);}return String(v);}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function sim(a,b){if(!a||!b)return 0;if(a===b)return 1;const s=Math.min(a.length,b.length);if(s>=3&&(a.includes(b)||b.includes(a)))return .99;return 1-lev(a,b)/Math.max(a.length,b.length);}

async function readWb(buf){const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf.slice(0));return wb;}
function layout(ws){
  let best=null;
  for(let r=1;r<=Math.min(15,ws.rowCount);r++){
    const heads={};let cnt=0;
    ws.getRow(r).eachCell((c,col)=>{const t=cellText(c.value).trim();if(t&&isNaN(t)){heads[col]=t;cnt++;}});
    if(cnt>=2&&(!best||cnt>best.cnt))best={headerRow:r,heads,cnt};
    if(best&&Object.values(best.heads).some(h=>/人名|姓名|名字|name/i.test(h)))break;
  }
  return best;
}
function bind(k){
  const drop=document.getElementById('d'+k),inp=document.getElementById('i'+k);
  const take=async f=>{if(!f)return;const buf=await f.arrayBuffer();document.getElementById('f'+k).textContent=f.name;
    try{S[k]={name:f.name,buf,wb:await readWb(buf)};}catch(e){alert('讀檔失敗：'+e.message);return;}
    fillSheets(k);setup();};
  inp.onchange=e=>take(e.target.files[0]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');take(e.dataTransfer.files[0]);};
}
bind('A');bind('B');
function fillSheets(k){const sel=document.getElementById('sh'+k);sel.innerHTML=S[k].wb.worksheets.map((w,i)=>`<option value="${i}">${w.name}</option>`).join('');sel.onchange=()=>setup(true);}
const $=id=>document.getElementById(id);
function ws(k){return S[k].wb.worksheets[+$('sh'+k).value||0];}

function setup(sheetChanged){
  if(!S.A||!S.B)return;
  S.la=layout(ws('A'));S.lb=layout(ws('B'));
  if(!S.la||!S.lb){alert('找不到標題列，請確認前 15 列有欄位名稱。');return;}
  $('cfg').hidden=false;
  if(sheetChanged||!$('pairs').children.length){
    $('pairs').innerHTML='';
    const findCol=(l,re)=>+Object.keys(l.heads).find(c=>re.test(l.heads[c]))||0;
    const re=/人名|姓名|名字|name/i;
    addPair(findCol(S.la,re)||+Object.keys(S.la.heads)[0],findCol(S.lb,re)||+Object.keys(S.lb.heads)[0]);
  }
  S.manual={};run();
}
function opts(l,sel){return Object.keys(l.heads).map(c=>`<option value="${c}"${+c===sel?' selected':''}>${l.heads[c]}</option>`).join('');}
function addPair(a,b){
  const d=document.createElement('div');d.className='pair';
  if(a==null){const used=currentPairs().map(p=>S.lb.heads[p.b]);const hA=Object.values(S.la.heads);
    b=+(Object.keys(S.lb.heads).find(c=>!used.includes(S.lb.heads[c])&&hA.includes(S.lb.heads[c]))||Object.keys(S.lb.heads)[0]);
    a=+(Object.keys(S.la.heads).find(c=>S.la.heads[c]===S.lb.heads[b])||Object.keys(S.la.heads)[0]);}
  d.innerHTML=`<span>A</span><select class="pa">${opts(S.la,a)}</select><span>↔ B</span><select class="pb">${opts(S.lb,b)}</select><button class="x" title="移除">✕</button>`;
  d.querySelectorAll('select').forEach(s=>s.onchange=()=>{S.manual={};run();});
  d.querySelector('button').onclick=()=>{if($('pairs').children.length>1){d.remove();S.manual={};run();}};
  $('pairs').appendChild(d);
}
$('addPair').onclick=()=>{addPair();S.manual={};run();};
function currentPairs(){return [...document.querySelectorAll('#pairs .pair')].map(d=>({a:+d.querySelector('.pa').value,b:+d.querySelector('.pb').value}));}
document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{S.manual={};run();});
$('thr').oninput=()=>{$('thrV').textContent=$('thr').value+'%';S.manual={};run();};
$('onlyKeep').onchange=()=>render();

function run(){
  const pairs=currentPairs();if(!pairs.length)return;
  const fuzzy=document.querySelector('input[name=mode]:checked').value==='fuzzy';
  const thr=+$('thr').value/100;
  const sa=ws('A'),sb=ws('B');
  const Arows=[];
  for(let r=S.la.headerRow+1;r<=sa.rowCount;r++){const row=sa.getRow(r);const keys=pairs.map(p=>norm(cellText(row.getCell(p.a).value)));if(keys.every(k=>!k))continue;Arows.push({keys,raw:pairs.map(p=>cellText(row.getCell(p.a).value).trim()).join('／')});}
  const exact=new Map(Arows.map(x=>[x.keys.join('|'),x]));
  const cols=Object.keys(S.lb.heads).map(Number).sort((a,b)=>a-b);
  const rows=[];
  for(let r=S.lb.headerRow+1;r<=sb.rowCount;r++){
    const row=sb.getRow(r);const keys=pairs.map(p=>norm(cellText(row.getCell(p.b).value)));
    if(keys.every(k=>!k))continue;
    let match=null,score=0;
    const ex=exact.get(keys.join('|'));
    if(ex&&keys.every(k=>k)){match=ex;score=1;}
    else if(fuzzy){for(const a of Arows){let s=1;for(let i=0;i<keys.length;i++){s=Math.min(s,sim(keys[i],a.keys[i]));if(s<thr)break;}if(s>=thr&&s>score){score=s;match=a;}}}
    rows.push({r,auto:!!match,match,score,vals:cols.map(c=>cellText(row.getCell(c).value))});
  }
  S.res={cols,rows};render();
}
const isDup=x=>x.r in S.manual?S.manual[x.r]:x.auto;
function render(){
  if(!S.res)return;const {cols,rows}=S.res;const only=$('onlyKeep').checked;
  $('bar').hidden=false;$('clickHint').hidden=false;
  $('nK').textContent=rows.filter(x=>!isDup(x)).length;
  $('nD').textContent=rows.filter(isDup).length;
  $('nF').textContent=rows.filter(x=>isDup(x)&&x.auto&&x.score<1).length;
  const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  let h='<table><thead><tr><th>列</th>'+cols.map(c=>'<th>'+esc(S.lb.heads[c])+'</th>').join('')+'<th>A 裡對到的</th></tr></thead><tbody>';
  for(const x of rows){const d=isDup(x);if(only&&d)continue;
    const m=x.match?`${x.score<1?'<span class="fz">≈</span> ':''}${esc(x.match.raw)}${x.score<1?` (${Math.round(x.score*100)}%)`:''}`:'';
    h+=`<tr data-r="${x.r}" class="${d?'dup':''}"><td>${x.r}${x.r in S.manual?'<span class="man">手動</span>':''}</td>`+x.vals.map(v=>'<td>'+esc(v)+'</td>').join('')+`<td class="m">${m}</td></tr>`;}
  $('out').innerHTML=h+'</tbody></table>';
  $('out').querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{const r=+tr.dataset.r;const x=S.res.rows.find(y=>y.r===r);const nv=!isDup(x);if(nv===x.auto)delete S.manual[r];else S.manual[r]=nv;render();});
}

$('dl').onclick=async()=>{
  const wb=await readWb(S.B.buf);const idx=+$('shB').value||0;const sh=wb.worksheets[idx];const {cols,rows}=S.res;
  const lastCol=Math.max(sh.columnCount,...cols);
  const grey={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9D9D9'}};
  const white={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFFFF'}};
  for(const x of rows){const row=sh.getRow(x.r);
    const f=isDup(x)?grey:white;
    if(isDup(x))row.style={...(row.style||{}),fill:{...grey}};
    for(let c=1;c<=lastCol;c++){const cell=row.getCell(c);cell.style={...(cell.style||{}),fill:{...f,fgColor:{...f.fgColor}}};}}
  let name='待寄名單';while(wb.getWorksheet(name))name+='_';
  const ns=wb.addWorksheet(name);
  cols.forEach((c,j)=>{const cell=ns.getCell(1,j+1);cell.value=S.lb.heads[c];cell.font={bold:true};});
  rows.filter(x=>!isDup(x)).forEach((x,i)=>x.vals.forEach((v,j)=>{ns.getCell(i+2,j+1).value=/^\d{1,9}$/.test(v)?Number(v):v;}));
  cols.forEach((_,i)=>{const col=ns.getColumn(i+1);let w=8;col.eachCell(c=>{w=Math.max(w,[...String(c.value??'')].reduce((s,ch)=>s+(ch.charCodeAt(0)>255?2:1),0)+2)});col.width=Math.min(w,60);});
  ns.views=[{state:'frozen',ySplit:1}];
  const out=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=S.B.name.replace(/\.xlsx$/i,'')+'_已標重複.xlsx';a.click();
};
</script>
</body>
</html>
